spring:
  flyway:
    locations: classpath:db/migration/mysql
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

aegiscare:
  storage:
    require-mysql: true
  demo-data:
    enabled: false
  security:
    jwt:
      secret: mysql-integration-test-secret-only-never-use-in-production-2026
    bootstrap-admin:
      enabled: false
